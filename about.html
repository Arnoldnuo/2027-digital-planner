    <h1>About</h1>
    <div class="meta">NUOVISION · A SMALL STUDIO</div>
    <p>nuoVision makes calm digital tools for people whose planning lives on an iPad. The 2027 Minimal Edition is our answer to a market full of planners that photograph beautifully and exhaust you by February.</p>
    <p>We believe a planner is a tool, not décor: light pages, quiet type, one excellent daily layout, and links that land exactly where your eye already is. Everything we don't need — ornate covers, page variants, motivational quotes — we left out on purpose.</p>
    <p>Every page of the 2027 edition was machine-laid and hand-checked: 472 pages, 8,600+ hyperlinks, dates verified against the real 2027 calendar, Sunday start throughout. If you find a link that misbehaves, write to us and it gets fixed in the next revision — buyers always get the newest file.</p>
    <h2>What we sell, plainly</h2>
    <ul class="checks">
      <li><a href="free.html">Free 2027 January mini planner</a> — the full month, no email required. It's the honest demo.</li>

    </ul>
    <p>Questions, feature ideas, bulk purchases (teams, classrooms)? Reach us via the Gumroad page's contact link.</p>
