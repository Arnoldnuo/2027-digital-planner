    <h1>How to choose a 2027 digital planner</h1>
    <div class="meta">GUIDE · OCT 2026 · 6 MIN READ</div>
    <p>Every autumn the market floods with "2027 digital planners" — Etsy alone shows thousands. Most are fine; some are excellent; a few are repackaged freebies. Rather than name ten planners, here is the checklist that separates the good from the decorative — the same list we used when designing our own.</p>

    <h2>1. Links first, decoration second</h2>
    <p>A planner without precise hyperlinks is a coloring book. Before buying anything, test a sample: month tabs, day cells, return buttons. If the seller offers no free sample and no preview video of live navigation, treat that as a warning. (Our <a href="../free.html">free January mini</a> exists partly so buyers can run exactly this test on us.)</p>

    <h2>2. Dated vs undated — know the trade</h2>
    <p><strong>Dated</strong> planners (like a 2027 edition) have a page for every day, pre-wired links, zero setup — you buy momentum. <strong>Undated</strong> planners repeat the same monthly template; they last forever but cost you a small setup ritual each month, and the "I'll start next week" failure mode is real. If you're buying for a new year's resolution, dated wins: the friction you remove in week one is worth more than the flexibility you keep.</p>

    <h2>3. Sunday or Monday start</h2>
    <p>US convention starts weeks on Sunday; international GTD-style planning often starts Monday. Neither is wrong, but flipping between your calendar app and a differently-started planner creates small paper cuts of confusion. Pick the one matching everything else you use. (Ours is Sunday-start; see <a href="sunday-start-planner.html">the Sunday vs Monday guide</a>.)</p>

    <h2>4. Page ratio: how many daily pages do you really use?</h2>
    <p>Some planners balloon to 1,000+ pages with ten daily-page variants. Fine in theory, but every variant multiplies your decision fatigue. A strong core is: one excellent daily layout, one weekly, one monthly — plus extras you'll actually open (habits, budget, projects). 400–500 pages is the sweet spot for a dated year; anything more should justify itself.</p>

    <h2>5. Visual quiet holds up for twelve months</h2>
    <p>Dark, elaborate layouts photograph beautifully and exhaust you by February. A planner you'll still like in month ten tends to be light, low-contrast, and quiet — decoration recedes, structure remains. Judge a planner by its <em>daily</em> page, not its cover: you'll write on the daily page 365 times.</p>

    <h2>6. Portrait 3:4 if you're on iPad</h2>
    <p>Pages sized to the iPad screen (portrait, roughly 3:4) mean no zooming to write and no dead margins. Landscape planners made for reMarkable-style devices feel cramped on a portrait-first tablet. If you use GoodNotes or Notability on iPad, portrait 3:4 is the right default.</p>

    <h2>7. Extras that match how you actually plan</h2>
    <ul class="checks">
      <li><strong>Habit trackers</strong> — one grid per month beats one giant year grid (you restart monthly, which is psychologically load-bearing).</li>
      <li><strong>Budget pages</strong> — twelve monthly sheets beat an annual spreadsheet you'll stop updating.</li>
      <li><strong>Goals + quarterly planning</strong> — the difference between a diary and a planner.</li>
      <li><strong>Year review</strong> — closes the loop in December; criminally rare feature.</li>
    </ul>
