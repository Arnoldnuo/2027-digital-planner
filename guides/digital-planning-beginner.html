    <h1>Digital planning for complete beginners</h1>
    <div class="meta">GUIDE · OCT 2026 · 7 MIN READ</div>
    <p>Digital planning is handwriting your life into a tablet calendar-journal hybrid — pen on glass instead of paper, with infinite undo and zero notebook graveyard. If you're starting for 2027, this page is everything you need to know in one read.</p>

    <h2>What you need (three things)</h2>
    <ul class="checks">
      <li><strong>An iPad (or any tablet + stylus)</strong> — any recent iPad works; screen size matters more than chip speed.</li>
      <li><strong>A PDF annotation app</strong> — GoodNotes, Notability, Noteshelf, Noteful or Xodo. Start with whatever your friends use; all import the same planner files. (<a href="import-goodnotes.html">Import guide</a> · <a href="goodnotes-vs-notability.html">app comparison</a>.)</li>
      <li><strong>A planner PDF</strong> — dated for 2027 if you're starting at new year (that's the point of the date), undated if you're starting mid-year.</li>
    </ul>

    <h2>How it works day to day</h2>
    <p>Morning: open the app, two taps to today (month tab → day cell), write your three priorities. During the day: check boxes, jot notes. Sunday: five minutes on next week's page. That's the whole ritual — the <a href="hyperlinked-planner-guide.html">links</a> do all the page-finding.</p>

    <h2>The habit that makes it stick (and the ones that don't)</h2>
    <p>Beginners fail by treating the planner like a journal — writing only when inspired — then feeling guilty by week two. The pattern that survives: <strong>one anchor moment per day</strong> (morning coffee = open today's page, even if you only check one box). One honest checkmark beats a beautiful spread. Everything else compounds from there.</p>

    <h2>Three beginner mistakes</h2>
    <ul class="checks">
      <li><strong>Buying a 1,000-page mega-planner</strong> — more pages means more decisions. Start with a focused core (see <a href="best-2027-digital-planners.html">the choosing guide</a>).</li>
      <li><strong>Decorating before planning</strong> — stickers and colors are fun, but the first 30 days should prove the habit. Decorate month two.</li>
      <li><strong>Skipping the free test</strong> — every planner claims to be "the best"; one week of real use settles it. (Ours: <a href="../free.html">January is free, full month</a>.)</li>
    </ul>

    <h2>Your first 7 days, concretely</h2>
    <ul class="checks">
      <li>Day 1 — import the planner, write today's date on the daily page. Just that.</li>
      <li>Day 2-3 — fill "Top 3" each morning, even trivial items. The box-checking is the habit.</li>
      <li>Day 4 — write one line on the weekly page's focus row.</li>
      <li>Day 5 — set one habit in the tracker; mark it each evening.</li>
      <li>Day 6-7 — Sunday reset: next week's page, one goal. You're now a digital planner person.</li>
    </ul>
